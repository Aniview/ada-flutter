name: ada
description: "Ada flutter plugin"
version: 1.4.0+1
repository: https://github.com/Aniview/ada-flutter

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.adservrs.ada.flutter
        pluginClass: AdaPlugin
      ios:
        pluginClass: AdaPlugin
